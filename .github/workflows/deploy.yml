name: ClubHub CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
    - name: Install Frontend Dependencies
      working-directory: ./frontend
      run: npm install
    - name: Build Frontend
      working-directory: ./frontend
      run: npm run build

  check-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
    - name: Install Backend Dependencies
      working-directory: ./backend
      run: npm install
    - name: Run Backend Lint/Test
      working-directory: ./backend
      run: |
        # Add test command here if available
        echo "Backend check passed"
